<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="icon.png">
  <title>RGB Light Button Card Preview</title>
  <style>
    :root {
      color-scheme: light dark;
      --primary-color: #0078a6;
      --text-primary-color: white;
      --primary-text-color: CanvasText;
      --secondary-text-color: GrayText;
      --card-background-color: Canvas;
      --divider-color: color-mix(in srgb, CanvasText 20%, Canvas);
      --disabled-color: color-mix(in srgb, CanvasText 16%, Canvas);
    }
    body {
      font: 16px system-ui, sans-serif;
      background: color-mix(in srgb, CanvasText 5%, Canvas);
      max-width: 28rem;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    rgb-light-button-card {
      background: var(--card-background-color);
      border: 1px solid var(--divider-color);
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <h1>RGB Light Button Card</h1>
  <p>Try the dashboard card with a simulated light.</p>
  <rgb-light-button-card></rgb-light-button-card>
  <p id="preview-state" role="status"></p>
  <script type="module">
    import './rgb-light-button-card.js';

    const card = document.querySelector('rgb-light-button-card');
    const previewState = document.querySelector('#preview-state');
    const entity = 'light.preview';
    let light = {
      entity_id: entity,
      state: 'on',
      attributes: {
        friendly_name: 'Living Room LED Strip',
        brightness: 192,
        rgb_color: [255, 230, 180],
        supported_color_modes: ['rgb'],
        effect_list: ['flash', 'strobe', 'fade', 'smooth'],
      },
    };
    function update() {
      const { rgb_color: rgb, effect } = light.attributes;
      previewState.textContent = light.state === 'off'
        ? 'Simulated light is off.'
        : `Simulated color is RGB (${rgb.join(', ')}).${effect ? ` Active effect is ${effect}.` : ''}`;
      card.hass = {
        states: { [entity]: light },
        async callService(domain, service, data) {
          const { brightness, rgb_color, effect } = data;
          const attributes = { ...light.attributes };
          if (brightness !== undefined) attributes.brightness = brightness;
          if (rgb_color) {
            attributes.rgb_color = rgb_color;
            delete attributes.effect;
          }
          if (effect) attributes.effect = effect;
          light = { ...light, state: service === 'turn_off' ? 'off' : 'on', attributes };
          update();
        },
      };
    }

    card.setConfig({ entity });
    update();
  </script>
</body>
</html>
